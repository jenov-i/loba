# ---------------------------------------------------------------------------
# Services externes utilisés par LOBA
#
#   docker compose up -d
#
# - PostgreSQL : la base de données (utilisateurs, messages, appels...)
# - MinIO      : le stockage de fichiers compatible S3 (photos, vocaux, docs)
#
# Les données sont conservées dans des volumes Docker : elles survivent aux
# redémarrages. Pour tout effacer : docker compose down -v
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: loba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loba
      POSTGRES_PASSWORD: loba
      POSTGRES_DB: loba
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loba -d loba"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO n'est plus publié sur Docker Hub sous "minio/minio".
    # On utilise l'image archivée par Bitnami, qui contient bien MinIO.
    # Solution de secours sans Docker : "npm run s3" (voir README).
    image: bitnamilegacy/minio:latest
    container_name: loba-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3 (utilisée par le serveur Node)
      - "9001:9001"   # Console web MinIO (http://localhost:9001)
    volumes:
      - minio_data:/data

volumes:
  db_data:
  minio_data:
